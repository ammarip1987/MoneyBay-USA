# Production profile - override with environment variables in deployment

server.port=${PORT:8080}

# PostgreSQL / Neon - set via env vars in deployment
# Neon (https://neon.tech): Dashboard -> Connect -> copy connection string, convert to JDBC:
#   jdbc:postgresql://<host>-pooler.<region>.aws.neon.tech/moneybay?sslmode=require&channel_binding=require
# Use the "-pooler" host in prod (serverless driver, PgBouncer-compatible pooling).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/moneybay?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:moneybay_app}
spring.datasource.password=${DB_PASSWORD:}

# Connection pool
# keepalive-time: Neon scales to zero after inactivity; prevents "connection reset" on wake
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:240000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}
# Neon pooler reuses server sessions: guarantee correct search_path on every connection
spring.datasource.hikari.connection-init-sql=SET search_path TO public

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT - MUST be set via env var in production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://moneybay.us,https://www.moneybay.us}

# File Upload (use Cloud Storage in production)
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}

# Frontend URL
app.frontend.url=${FRONTEND_URL:https://moneybay.us}

# Stripe
app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Logging
logging.level.root=WARN
logging.level.us.moneybay=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Actuator (health checks for Cloud Run)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Security
server.error.include-message=never
server.error.include-stacktrace=never

# Rate Limiting (enabled in prod; disable via RATE_LIMIT_ENABLED=false)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_RPM:5}
app.rate-limit.write-per-minute=${RATE_LIMIT_WRITE_RPM:20}

# reCAPTCHA (enabled in prod; requires RECAPTCHA_SECRET_KEY to actually verify)
app.recaptcha.enabled=${RECAPTCHA_ENABLED:true}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.min-score=${RECAPTCHA_MIN_SCORE:0.5}
