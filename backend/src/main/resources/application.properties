spring.application.name=moneybay-backend
server.port=5001

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# PostgreSQL Database
# Local default: localhost. For Neon set env vars (no code change needed):
#   DATABASE_URL=jdbc:postgresql://<host>-pooler.<region>.aws.neon.tech/moneybay?sslmode=require&channel_binding=require
#   DB_USERNAME=<neon-user>
#   DB_PASSWORD=<neon-password>
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/moneybay}
spring.datasource.username=${DB_USERNAME:moneybay_app}
spring.datasource.password=${DB_PASSWORD:moneybay123}
spring.datasource.driver-class-name=org.postgresql.Driver
# Neon: keepalive prevents dropped idle connections when compute scales to zero
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:240000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}
# Neon pooler reuses server sessions: guarantee correct search_path on every connection
spring.datasource.hikari.connection-init-sql=SET search_path TO public

# JPA / Hibernate
# Схему держит Flyway; Hibernate только сверяет её с сущностями и падает при
# расхождении, вместо того чтобы молча достраивать столбцы
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=change-this-in-production-to-a-secure-random-key-at-least-256-bits-long
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# CORS
app.cors.allowed-origins=http://localhost:1100,http://localhost:4200

# File Upload
app.upload.dir=./uploads

# Frontend URL
app.frontend.url=http://localhost:1100

# Stripe (configure with your keys)
app.stripe.secret-key=sk_test_dummy
app.stripe.webhook-secret=whsec_dummy

# reCAPTCHA (Google reCAPTCHA v2 or v3 - not Google Cloud)
# Sign up at google.com/recaptcha, get site key (frontend) + secret key (backend)
# Dev: disabled by default. Prod: set RECAPTCHA_ENABLED=true and RECAPTCHA_SECRET_KEY
app.recaptcha.enabled=${RECAPTCHA_ENABLED:false}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.min-score=${RECAPTCHA_MIN_SCORE:0.5}

# Rate Limiting (Bucket4j, in-memory per IP)
# Per-minute limits per client IP
# Disable for development, enable for production
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_RPM:5}
app.rate-limit.write-per-minute=${RATE_LIMIT_WRITE_RPM:20}

# Email Verification & Password Reset TTL
app.email-verification.token-ttl-hours=${EMAIL_VERIFY_TTL_HOURS:24}
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:60}

# Email / SMTP
# Dev: Mailtrap inbox (free 100/day). Sign up at mailtrap.io and replace credentials
# Prod: override via env vars MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Disable mail by default; set MAIL_ENABLED=true to send real emails
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@moneybay.us}
app.mail.from-name=${MAIL_FROM_NAME:MoneyBay}

# Dev Tools - отключить автоматическую перезагрузку
spring.devtools.restart.enabled=false

# Logging
logging.level.root=INFO
logging.level.us.moneybay=DEBUG

# Cloudflare R2
aws.r2.accessKeyId=${R2_ACCESS_KEY_ID:}
aws.r2.secretAccessKey=${R2_SECRET_ACCESS_KEY:}
aws.r2.endpoint=https://6cdba85b64841ba23d899ad6122f7eb9.r2.cloudflarestorage.com
aws.r2.bucketName=moneybayts-photos
aws.r2.region=auto

# OAuth2 social sign-in. Empty value = provider disabled and hidden on the client.
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.facebook.app-id=${FACEBOOK_APP_ID:}
app.oauth2.facebook.app-secret=${FACEBOOK_APP_SECRET:}
app.oauth2.apple.client-id=${APPLE_CLIENT_ID:}
app.oauth2.apple.team-id=${APPLE_TEAM_ID:}
app.oauth2.apple.key-id=${APPLE_KEY_ID:}
app.oauth2.apple.private-key=${APPLE_PRIVATE_KEY:}
# Публичный домен бакета R2. Пусто — фото идут через backend (/api/photos).
aws.r2.publicUrl=${R2_PUBLIC_URL:}

# Flyway
# baseline-on-migrate: у существующей базы схема уже есть, поэтому V1 отмечается
# применённой без выполнения. На чистой базе V1 создаёт схему с нуля.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
