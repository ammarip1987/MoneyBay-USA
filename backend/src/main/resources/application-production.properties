# Production profile - override with environment variables in deployment

server.port=${PORT:8080}

# PostgreSQL / AWS RDS - set via env vars in deployment
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/moneybay}
spring.datasource.username=${DB_USERNAME:moneybay_app}
spring.datasource.password=${DB_PASSWORD:}

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:240000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}
spring.datasource.hikari.connection-init-sql=SET search_path TO public

# JPA
# Схему держит Flyway; Hibernate только сверяет её с сущностями и падает при
# расхождении, вместо того чтобы молча достраивать столбцы
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# JWT - MUST be set via env var in production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# CORS (patterns; city subdomains included)
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://moneybay.us,https://www.moneybay.us,https://*.moneybay.us}

# File Upload (use Cloud Storage in production)
app.upload.dir=${UPLOAD_DIR:/tmp/uploads}

# Frontend URL
app.frontend.url=${FRONTEND_URL:https://moneybay.us}

# Stripe
app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Logging
logging.level.root=WARN
logging.level.us.moneybay=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Actuator: проверка состояния для ECS
management.endpoints.web.exposure.include=health,info
# Подробности видны: без них DOWN не разобрать, а состав ответа не тайна —
# показываются имена проверок, не значения настроек
management.endpoint.health.show-details=always

# Проверяется только то, без чего задача не может принимать запросы: база.
# Почтовый сервер из задачи недоступен, и его проверка одна давала DOWN —
# подключи ECS этот адрес как есть, задачи перезапускались бы без конца.
# Письма при недоступном сервере не уходят, но объявления показываются.
management.health.mail.enabled=false
management.health.diskspace.enabled=false

# Security
server.error.include-message=never
server.error.include-stacktrace=never

# Rate Limiting (enabled in prod; disable via RATE_LIMIT_ENABLED=false)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_RPM:5}
app.rate-limit.write-per-minute=${RATE_LIMIT_WRITE_RPM:20}

# reCAPTCHA (enabled in prod; requires RECAPTCHA_SECRET_KEY to actually verify)
app.recaptcha.enabled=${RECAPTCHA_ENABLED:true}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.min-score=${RECAPTCHA_MIN_SCORE:0.5}

# Flyway
# baseline-on-migrate: у существующей базы схема уже есть, поэтому V1 отмечается
# применённой без выполнения. На чистой базе V1 создаёт схему с нуля.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Область куки с обновляющим токеном: точка впереди — чтобы её слал и сайт,
# и API, они на разных именах
app.cookie.domain=${COOKIE_DOMAIN:.moneybay.us}

# Почта: Amazon SES через SMTP.
#
# Ключи приходят из Secrets Manager, как пароль базы: пара «имя/пароль SMTP»
# заводится отдельно от обычных ключей AWS и годится только для отправки.
#
# Порт 587 со STARTTLS: 465 у SES тоже есть, но требует иной настройки, а 25
# закрыт на исходящих соединениях задачи.
spring.mail.host=${MAIL_HOST:email-smtp.us-east-2.amazonaws.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Отправитель: адрес на подтверждённом домене. Ящика за ним нет — ответы идут
# на reply-to, который задаётся в самом письме
app.mail.from=${MAIL_FROM:no-reply@moneybay.us}

# Отправка включена: до этого письма не уходили вовсе
app.mail.enabled=${MAIL_ENABLED:true}
