# Test profile — H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT for tests
app.jwt.secret=test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-padding-data
app.jwt.expiration=3600000

# CORS
app.cors.allowed-origins=http://localhost:1100

# File upload
app.upload.dir=./test-uploads

# Frontend
app.frontend.url=http://localhost:1100

# Stripe (dummy)
app.stripe.secret-key=sk_test_dummy
app.stripe.webhook-secret=whsec_dummy

# Disable DevTools in tests
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Disable mail in tests
app.mail.enabled=false

# Disable rate limiting in tests
app.rate-limit.enabled=false

# Disable reCAPTCHA in tests
app.recaptcha.enabled=false

# Logging
logging.level.us.moneybay=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN

# Тесты идут на H2 с create-drop: миграции PostgreSQL там неприменимы
spring.flyway.enabled=false

# Заглушки для R2: без них S3Client не создаётся на пустых ключах и контекст не
# поднимается. Наружу ничего не уходит — тесты к хранилищу не обращаются.
aws.r2.accessKeyId=test
aws.r2.secretAccessKey=test
