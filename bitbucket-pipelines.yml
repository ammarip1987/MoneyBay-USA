image: eclipse-temurin:25-jdk

pipelines:
  branches:
    main:
      - step:
          name: Build Java Backend
          caches:
            - maven
          script:
            - cd backend
            - chmod +x mvnw
            - ./mvnw clean package -DskipTests
          artifacts:
            - backend/target/*.jar

      - step:
          name: Deploy JAR to AWS Server
          deployment: production
          script:
            - pipe: atlassian/scp-deploy:1.2.1
              variables:
                USER: 'admin'
                SERVER: '16.16.207.124'
                REMOTE_PATH: '/home/admin/apps/backend'
                LOCAL_PATH: 'backend/target/*.jar'
          after-script:
            - pipe: atlassian/ssh-run:0.4.1
              variables:
                SSH_USER: 'admin'
                SERVER: '16.16.207.124'
                COMMAND: |
                  cd /home/admin/apps
                  pkill -f "backend-0.0.1-SNAPSHOT.jar" || true
                  export DATABASE_URL="jdbc:postgresql://db-moneybay-usa.c5qkmgi6m2e9.eu-north-1.rds.amazonaws.com:5432/moneybay"
                  export DB_USERNAME="moneybayusa"
                  export DB_PASSWORD="${DB_PASSWORD}"
                  export JWT_SECRET="${JWT_SECRET}"
                  export SPRING_PROFILES_ACTIVE=prod
                  nohup java -jar backend/backend-0.0.1-SNAPSHOT.jar > app.log 2>&1 &

      - step:
          name: Build and Deploy Frontend to Cloudflare Pages
          image: node:20
          variables:
            CLOUDFLARE_API_TOKEN: '${CLOUDFLARE_API_TOKEN}'
            CLOUDFLARE_ACCOUNT_ID: '${CLOUDFLARE_ACCOUNT_ID}'
          script:
            - node --version && npm --version
            - npm ci --legacy-peer-deps
            - NODE_ENV=production npm run build
            - npm install -g wrangler
            - wrangler pages deploy dist/moneybay-angular/browser --project-name=moneybay
