image: eclipse-temurin:25-jdk

pipelines:
  branches:
    main: 
      - step:
          name: Build Java Backend
          caches:
            - maven
          script:
            - cd backend
            - chmod +x mvnw
            - ./mvnw clean package -DskipTests
          artifacts:
            - backend/target/*.jar

      - step:
          name: Deploy JAR to AWS Server
          deployment: production
          script:
            - pipe: atlassian/scp-deploy:1.2.1
              variables:
                USER: 'admin'
                SERVER: '16.16.207.124'
                REMOTE_PATH: '/home/admin/apps/backend'
                LOCAL_PATH: 'backend/target/*.jar'

            - pipe: atlassian/ssh-run:0.4.1
              variables:
                USER: 'admin'
                SERVER: '16.16.207.124'
                COMMAND_SEQUENCE:
                  - 'cd /home/admin/apps/backend'
                  - 'pkill -f "java -jar" || true'
                  - 'nohup java -jar *.jar > backend.log 2>&1 &'
