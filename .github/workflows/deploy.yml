name: Deploy Backend to AWS ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: moneybay-usa
  ECS_SERVICE: moneybay-api
  ECS_CLUSTER: default
  ECS_TASK_DEFINITION: task-def.json
  CONTAINER_NAME: Main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Раннер на x86, а задача ECS на ARM64 — сборка идёт через QEMU,
      # поэтому нужны setup-qemu и buildx вместо обычного docker build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          provenance: false
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Ожидание отключено намеренно. Действие следит за идентификатором
      # развёртывания, а балансировка Fargate по зонам доступности заменяет
      # отслеживаемый taskSet: идентификатор исчезает, и шаг сообщает
      # "not found after stabilization", хотя развёртывание доходит. Circuit
      # breaker при этом отключён (enable: false), откатывать некому.
      # Проверка перенесена в следующий шаг — по ревизии задачи и здоровью
      # целей, эти признаки от подмены taskSet не зависят.
      - name: Deploy task definition to ECS service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Wait for the new revision to take traffic
        env:
          EXPECTED_TASK_DEF: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          set -uo pipefail

          describe() {
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].$1" --output text
          }

          TG_ARN=$(describe 'loadBalancers[0].targetGroupArn')
          echo "Ожидаем ревизию: ${EXPECTED_TASK_DEF##*/}"
          echo "Целевая группа:  ${TG_ARN##*/}"

          # 40 проверок по 30 секунд — 20 минут. Запуск задачи на ARM64 вместе
          # с прогревом JVM и проверками балансировщика укладывается в
          # несколько минут, остальное запас.
          for i in $(seq 1 40); do
            read -r RUNNING_DEF RUNNING DESIRED <<<"$(describe '[taskDefinition,runningCount,desiredCount]')"

            STATES=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
              --query 'TargetHealthDescriptions[].TargetHealth.State' --output text)
            HEALTHY=$(printf '%s\n' $STATES | grep -c '^healthy$' || true)

            echo "[$i/40] ревизия=${RUNNING_DEF##*/} задачи=$RUNNING/$DESIRED цели=[${STATES:-нет}]"

            if [ "$RUNNING_DEF" = "$EXPECTED_TASK_DEF" ] \
               && [ "$RUNNING" = "$DESIRED" ] \
               && [ "$HEALTHY" -ge 1 ]; then
              echo "Готово: новая ревизия принимает трафик."
              exit 0
            fi

            sleep 30
          done

          echo "Новая ревизия не приняла трафик за 20 минут. Последние события сервиса:"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].events[0:5].message' --output text | tr '\t' '\n'
          exit 1
