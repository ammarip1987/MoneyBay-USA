name: Build and Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GCP_PROJECT: artful-host-439214-c4
  GCP_REGION: us-central1

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
      - name: Build and test backend
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw -B test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  deploy-backend:
    needs: test-backend
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          cd backend
          gcloud builds submit --tag gcr.io/$GCP_PROJECT/moneybay-backend --project $GCP_PROJECT
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy moneybay-backend \
            --image gcr.io/$GCP_PROJECT/moneybay-backend \
            --platform managed \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --set-env-vars SPRING_PROFILES_ACTIVE=prod \
            --project $GCP_PROJECT

  deploy-frontend:
    needs: test-frontend
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          gcloud builds submit --tag gcr.io/$GCP_PROJECT/moneybay-frontend --project $GCP_PROJECT
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy moneybay-frontend \
            --image gcr.io/$GCP_PROJECT/moneybay-frontend \
            --platform managed \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --project $GCP_PROJECT
