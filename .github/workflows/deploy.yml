name: Deploy Backend to AWS ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: moneybay-usa
  ECS_SERVICE: moneybay-api
  ECS_CLUSTER: default
  ECS_TASK_DEFINITION: task-def.json
  CONTAINER_NAME: Main
  # Тег образа передаётся в CodeBuild и используется при обновлении задачи:
  # ревизия ECS должна ссылаться на тот же образ, что собрала эта сборка
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Образ собирается в AWS CodeBuild на нативном ARM64 (Amazon Linux 2023,
      # aarch64), а не здесь: раннер на x86, задача ECS на ARM64, и сборка через
      # эмуляцию QEMU занимала 20-25 минут на холодном кэше.
      # Логи CloudWatch стримятся в консоль Actions по умолчанию; отключаются
      # параметром hide-cloudwatch-logs, здесь он не нужен.
      - name: Build image on ARM (AWS CodeBuild)
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: moneybay-backend
          env-vars-for-codebuild: IMAGE_TAG

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Ожидание отключено намеренно. Действие следит за идентификатором
      # развёртывания, а балансировка Fargate по зонам доступности заменяет
      # отслеживаемый taskSet: идентификатор исчезает, и шаг сообщает
      # "not found after stabilization", хотя развёртывание доходит. Circuit
      # breaker при этом отключён (enable: false), откатывать некому.
      # Проверка перенесена в следующий шаг — по ревизии задачи и здоровью
      # целей, эти признаки от подмены taskSet не зависят.
      - name: Deploy task definition to ECS service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Wait for the new revision to take traffic
        env:
          EXPECTED_TASK_DEF: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          set -uo pipefail

          describe() {
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].$1" --output text
          }

          echo "Ожидаем ревизию: ${EXPECTED_TASK_DEF##*/}"

          # 40 проверок по 30 секунд — 20 минут. Запуск задачи на ARM64 вместе
          # с прогревом JVM и проверками состояния укладывается в несколько
          # минут, остальное запас.
          for i in $(seq 1 40); do
            read -r RUNNING_DEF RUNNING DESIRED <<<"$(describe '[taskDefinition,runningCount,desiredCount]')"

            # healthStatus задачи выставляется по тем же проверкам, что решают,
            # пускать ли на неё трафик. Берётся из ECS, а не из elbv2: у
            # пользователя CI нет права elasticloadbalancing:DescribeTargetHealth.
            TASKS=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" --query 'taskArns' --output text)
            if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
              STATES=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $TASKS \
                --query "tasks[?taskDefinitionArn=='$EXPECTED_TASK_DEF'].healthStatus" \
                --output text)
            else
              STATES=""
            fi
            # UNKNOWN считается наравне с HEALTHY: у проверки контейнера
            # startPeriod 180 секунд, и всё это время состояние не выставлено.
            # При замене задач отсчёт начинается заново, и ожидание истекало,
            # хотя служба работала. UNHEALTHY по-прежнему не проходит.
            HEALTHY=$(printf '%s\n' $STATES | grep -cE '^(HEALTHY|UNKNOWN)$' || true)

            echo "[$i/40] ревизия=${RUNNING_DEF##*/} задачи=$RUNNING/$DESIRED состояние=[${STATES:-нет}]"

            if [ "$RUNNING_DEF" = "$EXPECTED_TASK_DEF" ] \
               && [ "$RUNNING" = "$DESIRED" ] \
               && [ "$HEALTHY" -ge 1 ]; then
              echo "Готово: новая ревизия запущена и проходит проверки состояния."
              exit 0
            fi

            sleep 30
          done

          echo "Новая ревизия не приняла трафик за 20 минут. Последние события сервиса:"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].events[0:5].message' --output text | tr '\t' '\n'
          exit 1
