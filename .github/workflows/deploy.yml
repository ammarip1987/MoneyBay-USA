name: Deploy Backend to AWS ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: moneybay-usa
  ECS_SERVICE: moneybay-api
  ECS_CLUSTER: default
  ECS_TASK_DEFINITION: task-def.json
  CONTAINER_NAME: Main
  # Тег образа передаётся в CodeBuild и используется при обновлении задачи:
  # ревизия ECS должна ссылаться на тот же образ, что собрала эта сборка
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Образ собирается в AWS CodeBuild на нативном ARM64 (Amazon Linux 2023,
      # aarch64), а не здесь: раннер на x86, задача ECS на ARM64, и сборка через
      # эмуляцию QEMU занимала 20-25 минут на холодном кэше.
      # Логи CloudWatch стримятся в консоль Actions по умолчанию; отключаются
      # параметром hide-cloudwatch-logs, здесь он не нужен.
      - name: Build image on ARM (AWS CodeBuild)
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: moneybay-backend
          env-vars-for-codebuild: IMAGE_TAG

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render task definition with new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Ожидание отключено намеренно. Действие следит за идентификатором
      # развёртывания, а балансировка Fargate по зонам доступности заменяет
      # отслеживаемый taskSet: идентификатор исчезает, и шаг сообщает
      # "not found after stabilization", хотя развёртывание доходит. Circuit
      # breaker при этом отключён (enable: false), откатывать некому.
      # Проверка перенесена в следующий шаг — по ревизии задачи и здоровью
      # целей, эти признаки от подмены taskSet не зависят.
      - name: Deploy task definition to ECS service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Wait for the new revision to take traffic
        env:
          EXPECTED_TASK_DEF: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          set -uo pipefail

          describe() {
            aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].$1" --output text
          }

          echo "Ожидаем ревизию: ${EXPECTED_TASK_DEF##*/}"

          # 40 проверок по 30 секунд — 20 минут. Запуск задачи на ARM64 вместе
          # с прогревом JVM и проверками состояния укладывается в несколько
          # минут, остальное запас.
          for i in $(seq 1 40); do
            read -r RUNNING_DEF RUNNING DESIRED <<<"$(describe '[taskDefinition,runningCount,desiredCount]')"

            # healthStatus задачи выставляется проверкой контейнера. Берётся из
            # ECS, а не из elbv2: у пользователя CI нет права
            # elasticloadbalancing:DescribeTargetHealth, да и балансировщика
            # больше нет в пути.
            #
            # Берутся только задачи в RUNNING: без этого в выборку попадают и
            # погашенные, и состояние читается не у той.
            TASKS=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" --desired-status RUNNING \
              --query 'taskArns' --output text)
            if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
              # Сравнение по номеру ревизии, а не по полному пути: ECS
              # подменяет набор задач, пути расходятся, и выборка возвращала
              # пусто при работающей задаче — ожидание висело все двадцать минут
              STATES=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $TASKS \
                --query "tasks[?ends_with(taskDefinitionArn, '/${EXPECTED_TASK_DEF##*/}')].healthStatus" \
                --output text)
            else
              STATES=""
            fi
            # UNKNOWN считается наравне с HEALTHY: у проверки контейнера
            # startPeriod 180 секунд, и всё это время состояние не выставлено.
            # При замене задач отсчёт начинается заново, и ожидание истекало,
            # хотя служба работала. UNHEALTHY по-прежнему не проходит.
            HEALTHY=$(printf '%s\n' $STATES | grep -cE '^(HEALTHY|UNKNOWN)$' || true)

            echo "[$i/40] ревизия=${RUNNING_DEF##*/} задачи=$RUNNING/$DESIRED состояние=[${STATES:-нет}]"

            if [ "${RUNNING_DEF##*/}" = "${EXPECTED_TASK_DEF##*/}" ] \
               && [ "$RUNNING" = "$DESIRED" ] \
               && [ "$HEALTHY" -ge 1 ]; then
              echo "Готово: новая ревизия запущена и проходит проверки состояния."
              exit 0
            fi

            sleep 30
          done

          echo "Новая ревизия не приняла трафик за 20 минут. Последние события сервиса:"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].events[0:5].message' --output text | tr '\t' '\n'
          exit 1

      # Адрес задачи меняется при каждом запуске, поэтому запись обновляется
      # здесь, а не задаётся раз и навсегда. Балансировщика больше нет, и на
      # этом шаге держится доступность сайта: не обновит запись — api будет
      # указывать на погашенную задачу.
      - name: Point api at the task address
        # Выполняется даже когда ожидание не дождалось: задача к тому времени
        # обычно уже работает, а без обновления записи api будет указывать на
        # погашенную — сайт ляжет из-за неудачной проверки, а не из-за поломки
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          RECORD_NAME: api.moneybay.us
        run: |
          set -uo pipefail

          API="https://api.cloudflare.com/client/v4/zones/$CF_ZONE/dns_records"
          AUTH="Authorization: Bearer $CF_TOKEN"

          # Адрес задачи читается, записывается, а потом перечитывается. Если
          # ECS подменил задачу между чтением и записью, запись указывает на
          # погашенную и сайт ложится - это уже случалось. Заход повторяется,
          # пока прочитанный адрес не совпадёт с тем, что стоит в записи.
          for attempt in 1 2 3 4 5; do
            TASK=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" --desired-status RUNNING \
              --query 'taskArns[0]' --output text)
            if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
              echo "[$attempt/5] задач в RUNNING нет"
              sleep 20
              continue
            fi

            ENI=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
              --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
              --output text)
            IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" \
              --query 'NetworkInterfaces[0].Association.PublicIp' --output text)

            if [ -z "$IP" ] || [ "$IP" = "None" ]; then
              echo "[$attempt/5] у задачи нет публичного адреса"
              sleep 20
              continue
            fi
            echo "[$attempt/5] адрес задачи: $IP"

            # Запись ищется по имени: при первом прогоне её ещё нет и она
            # заводится, дальше правится существующая
            # || true обязателен: при первом прогоне записи нет, grep ничего не
            # находит и возвращает единицу - под set -e это обрывало весь шаг
            LOOKUP=$(curl -sS -X GET "$API?type=A&name=$RECORD_NAME" -H "$AUTH")
            REC=$(echo "$LOOKUP" | grep -o '"id":"[a-f0-9]\{32\}"' | head -1 | cut -d'"' -f4 || true)

            # proxied: true - адрес задачи не светится наружу, и правила
            # Cloudflare продолжают действовать, как на api через балансировщик
            BODY=$(printf '{"type":"A","name":"%s","content":"%s","ttl":60,"proxied":true}' \
              "$RECORD_NAME" "$IP")

            if [ -n "$REC" ]; then
              RESP=$(curl -sS -X PUT "$API/$REC" -H "$AUTH" \
                -H "Content-Type: application/json" --data "$BODY")
            else
              RESP=$(curl -sS -X POST "$API" -H "$AUTH" \
                -H "Content-Type: application/json" --data "$BODY")
            fi

            OK=$(echo "$RESP" | grep -c '"success":true' || true)
            if [ "$OK" -lt 1 ]; then
              echo "Cloudflare отказал: $RESP"
              exit 1
            fi

            # Проверка после записи: задача всё ещё та же и всё ещё работает
            sleep 15
            NOW=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" --desired-status RUNNING \
              --query 'taskArns[0]' --output text)
            if [ "$NOW" = "$TASK" ]; then
              echo "Запись обновлена: $RECORD_NAME -> $IP"
              exit 0
            fi
            echo "[$attempt/5] задача сменилась после записи, заходим снова"
          done

          echo "Адрес задачи не устоялся за пять заходов."
          exit 1
