<!-- Колонка на всю высоту окна: main растягивается, подвал прижат к низу.
     Иначе на короткой странице подвал стоит посреди экрана и уезжает вниз,
     когда приходят данные. -->
<!-- Ссылка видна только при переходе с клавиатуры: первое нажатие Tab
     предлагает пропустить шапку с её перечнем разделов и попасть сразу к
     объявлениям. Без неё до содержимого добираются двумя десятками нажатий -->
<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:bg-white focus:text-mb-dark focus:rounded focus:shadow-lg"
  >Skip to main content</a
>

<div class="min-h-screen flex flex-col">
  <app-header></app-header>

  <!-- flex-col на main: страница внутри получает h-full от растянутой
       колонки, поэтому короткая страница не поднимает подвал -->
  <main id="main-content" tabindex="-1" class="flex-1 flex flex-col w-full max-w-7xl mx-auto px-4 py-8">
    <router-outlet />
  </main>

  <app-footer></app-footer>
</div>

<app-toast></app-toast>
<app-scroll-top></app-scroll-top>
